version: "3.9"

services:
  php:
    build: .
    container_name: construcao_php
    volumes:
      - ./src:/var/www/html
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: construcao_nginx
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
